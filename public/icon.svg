<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#C8A96E" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Warm cream background with squircle rounding -->
  <rect width="512" height="512" rx="115" fill="#FAF8F3"/>

  <!-- Journal book (spine + pages) centred in safe zone -->
  <g filter="url(#shadow)">
    <!-- Spine -->
    <rect x="156" y="138" width="44" height="236" rx="12" fill="#C8A96E"/>
    <!-- Pages body -->
    <rect x="192" y="138" width="168" height="236" rx="0" fill="#FFFDF7"/>
    <!-- Right corner rounding -->
    <rect x="344" y="138" width="16" height="236" rx="0" fill="#FFFDF7"/>
    <rect x="192" y="138" width="176" height="236" rx="12" fill="#FFFDF7"/>
    <!-- Left edge of pages (covers spine join) -->
    <rect x="192" y="138" width="12" height="236" fill="#FFFDF7"/>
    <!-- Page border -->
    <rect x="192" y="138" width="176" height="236" rx="12" fill="none" stroke="#EDD9A3" stroke-width="2.5"/>
  </g>

  <!-- Ruled lines -->
  <rect x="218" y="198" width="120" height="12" rx="6" fill="#E8D5B0"/>
  <rect x="218" y="228" width="98"  height="12" rx="6" fill="#E8D5B0"/>
  <rect x="218" y="258" width="112" height="12" rx="6" fill="#E8D5B0"/>

  <!-- Sun circle (coral/warm) -->
  <circle cx="248" cy="315" r="26" fill="#D4927A"/>
  <!-- Inner highlight -->
  <circle cx="248" cy="315" r="14" fill="#FAF8F3" opacity="0.35"/>
</svg>
