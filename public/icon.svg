<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

  <!-- Warm cream background — no rounded corners; Android/iOS clip to their own shape -->
  <rect width="512" height="512" fill="#FAF8F3"/>

  <!-- Journal spine (golden) -->
  <rect x="152" y="128" width="48" height="256" rx="10" fill="#C8A96E"/>

  <!-- Journal pages (warm white) -->
  <rect x="192" y="128" width="176" height="256" rx="10" fill="#FFFDF7"/>

  <!-- Page border (light golden) -->
  <rect x="192" y="128" width="176" height="256" rx="10" fill="none" stroke="#E8D5B0" stroke-width="3"/>

  <!-- Ruled lines -->
  <rect x="220" y="192" width="120" height="13" rx="6" fill="#E8D5B0"/>
  <rect x="220" y="224" width="98"  height="13" rx="6" fill="#E8D5B0"/>
  <rect x="220" y="256" width="112" height="13" rx="6" fill="#E8D5B0"/>

  <!-- Sun circle (warm coral) -->
  <circle cx="256" cy="318" r="30" fill="#D4927A"/>

  <!-- Sun inner ring for depth (no filter needed) -->
  <circle cx="256" cy="318" r="18" fill="#E8A88C"/>

</svg>
