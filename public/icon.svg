<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Journal body -->
  <rect x="126" y="88" width="254" height="328" rx="20" fill="white" opacity="0.96"/>

  <!-- Spine -->
  <rect x="126" y="88" width="36" height="328" rx="16" fill="#fde68a"/>
  <rect x="144" y="88" width="18" height="328" fill="#fde68a"/>

  <!-- Ruled lines -->
  <rect x="186" y="160" width="158" height="11" rx="5.5" fill="#fde68a"/>
  <rect x="186" y="192" width="136" height="11" rx="5.5" fill="#fde68a"/>
  <rect x="186" y="224" width="150" height="11" rx="5.5" fill="#fde68a"/>
  <rect x="186" y="256" width="120" height="11" rx="5.5" fill="#fde68a"/>

  <!-- Heart -->
  <path d="M256 330 C254 328 192 284 192 246
           C192 226 206 214 222 216
           C236 218 248 230 256 240
           C264 230 276 218 290 216
           C306 214 320 226 320 246
           C320 284 258 328 256 330 Z"
        fill="#f59e0b"/>

  <!-- Sun (top-right, partially clipped by book corner) -->
  <circle cx="374" cy="134" r="46" fill="url(#sunGrad)"/>
  <circle cx="374" cy="134" r="28" fill="#fbbf24"/>
  <!-- Sun rays -->
  <line x1="374" y1="76"  x2="374" y2="62"  stroke="#fef3c7" stroke-width="8" stroke-linecap="round"/>
  <line x1="418" y1="90"  x2="428" y2="80"  stroke="#fef3c7" stroke-width="8" stroke-linecap="round"/>
  <line x1="432" y1="134" x2="446" y2="134" stroke="#fef3c7" stroke-width="8" stroke-linecap="round"/>
  <line x1="418" y1="178" x2="428" y2="188" stroke="#fef3c7" stroke-width="8" stroke-linecap="round"/>
  <line x1="330" y1="90"  x2="320" y2="80"  stroke="#fef3c7" stroke-width="8" stroke-linecap="round"/>
  <line x1="316" y1="134" x2="302" y2="134" stroke="#fef3c7" stroke-width="8" stroke-linecap="round"/>
  <line x1="330" y1="178" x2="320" y2="188" stroke="#fef3c7" stroke-width="8" stroke-linecap="round"/>
</svg>
